name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        openmp: ['0', '1']
    env:
      EIGEN_INCLUDE_DIR: ${{ github.workspace }}/vendor/eigen
      SPPY_OPENMP: ${{ matrix.openmp }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install Eigen 5.0.1
        run: |
          mkdir -p vendor/eigen
          curl -fL https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.gz | tar xz --strip-components=1 -C vendor/eigen
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check sppy
      - run: uv run --locked clang-format --dry-run --Werror sppy/include/*.h sppy/test/*.cpp
      - run: uv build
