name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        openmp: ['0', '1']
    env:
      EIGEN_INCLUDE_DIR: ${{ github.workspace }}/vendor/eigen
      SPPY_OPENMP: ${{ matrix.openmp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Eigen 5.0.1
        run: |
          mkdir -p vendor/eigen
          curl -fL https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.gz | tar xz --strip-components=1 -C vendor/eigen
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: ruff check .
      - run: ruff format --check sppy setup.py
      - run: clang-format --dry-run --Werror sppy/include/*.h sppy/test/*.cpp
      - run: python -m build
