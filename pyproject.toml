[build-system]
requires = ["scikit-build-core>=0.12", "pybind11>=3,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "sppy"
version = "1.0.0"
description = "NumPy-style sparse arrays backed by Eigen"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [{name = "Charanpal Dhanjal", email = "charanpal@gmail.com"}]
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
scipy = ["scipy>=1.14"]
test = ["pytest>=8", "scipy>=1.14", "hypothesis>=6.100", "threadpoolctl>=3.6"]

[dependency-groups]
# mkdocstrings 0.30 is incompatible with the pymdown Highlight API in 12+.
docs = ["mkdocs>=1.6,<2", "mkdocstrings[python]>=0.30,<1", "pymdown-extensions>=10,<12"]
dev = ["pytest>=8", "scipy>=1.14", "ruff>=0.9", "clang-format>=18", "threadpoolctl>=3.6", "mypy>=1.15,<3", "hypothesis>=6.100"]

[tool.scikit-build]
build-dir = "build/native/{wheel_tag}"
minimum-version = "build-system.requires"
wheel.packages = ["sppy"]
wheel.exclude = ["**/__pycache__/**", "sppy/native/**"]
sdist.include = ["uv.lock", ".python-version", ".clang-format"]
sdist.exclude = [".pytest_cache/**", ".ruff_cache/**", "**/*.so", "**/*.pyd", "**/__pycache__/**", "vendor/**", "build/**", "dist/**", ".venv/**", "*.egg-info/**"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "cmake/**/*.cmake" },
    { file = "sppy/**/*.py" },
    { file = "sppy/native/**/*.h" },
    { file = "sppy/native/**/*.cpp" },
    { env = "EIGEN_INCLUDE_DIR" },
    { env = "SPPY_OPENMP" },
    { env = "SPPY_SANITIZERS" },
    { file = "sppy/**/*.pyi" },
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["native: contracts at the pybind11/Eigen boundary"]

[tool.ruff]
target-version = "py311"
exclude = ["build"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "ANN", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]
# Dynamic native bindings, heterogeneous reports, and invalid test inputs need Any.
ignore = ["ANN401"]

[tool.mypy]
files = ["sppy"]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Stubs document signatures; implementation docstrings live in the source/bindings.
"*.pyi" = ["D"]
